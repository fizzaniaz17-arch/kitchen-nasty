name: Member 1 Quality Gates

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  member1-coverage:
    name: Member 1 / 100% Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -w packages/server prisma generate --schema ../../prisma/schema.prisma
      - run: npm run coverage:member1
      - name: Upload coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member1-coverage
          path: packages/server/coverage/member-1/
          retention-days: 14

  member1-mutation:
    name: Member 1 / Mutation 60%
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -w packages/server prisma generate --schema ../../prisma/schema.prisma
      - run: npm run mutation:member1
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: member1-mutation
          path: reports/mutation/final-56-tests/
          retention-days: 14

  member1-custom-mutations:
    name: Member 1 / Custom Mutations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx -w packages/server prisma generate --schema ../../prisma/schema.prisma
      - name: CM-A maximum 50 to 49 must fail
        shell: bash
        run: |
          sed -i '0,/\.max(50)/s//.max(49)/' packages/server/src/controllers/reservation.controller.ts
          if npm run test:member1; then
            echo "CM-A survived unexpectedly"
            exit 1
          fi
          git restore packages/server/src/controllers/reservation.controller.ts
      - name: CM-B inverted slot match must fail
        shell: bash
        run: |
          sed -i '0,/r\.time === time && r\.tableId/s//r.time !== time \&\& r.tableId/' packages/server/src/controllers/reservation.controller.ts
          if npm run test:member1; then
            echo "CM-B survived unexpectedly"
            exit 1
          fi
          git restore packages/server/src/controllers/reservation.controller.ts

  member1-sonar:
    name: Member 1 / Sonar Quality Gate
    runs-on: ubuntu-latest
    needs: member1-coverage
    env:
      SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: member1-coverage
          path: packages/server/coverage/member-1
      - name: Require reachable Sonar configuration
        shell: bash
        run: |
          test -n "$SONAR_HOST_URL"
          test -n "$SONAR_TOKEN"
          curl --fail --silent --show-error "$SONAR_HOST_URL/api/system/status"
      - name: Analyze and wait for this analysis quality gate
        run: >-
          docker run --rm
          -e SONAR_HOST_URL
          -e SONAR_TOKEN
          -v "${{ github.workspace }}:/usr/src"
          sonarsource/sonar-scanner-cli:11.5.0.2154_7.3.0
          -Dsonar.qualitygate.wait=true
          -Dsonar.qualitygate.timeout=300

  member1-required:
    name: Member 1 / Required
    if: always()
    runs-on: ubuntu-latest
    needs: [member1-coverage, member1-mutation, member1-custom-mutations, member1-sonar]
    steps:
      - name: Enforce all Member 1 gates
        env:
          COVERAGE_RESULT: ${{ needs.member1-coverage.result }}
          MUTATION_RESULT: ${{ needs.member1-mutation.result }}
          CUSTOM_RESULT: ${{ needs.member1-custom-mutations.result }}
          SONAR_RESULT: ${{ needs.member1-sonar.result }}
        shell: bash
        run: |
          test "$COVERAGE_RESULT" = success
          test "$MUTATION_RESULT" = success
          test "$CUSTOM_RESULT" = success
          test "$SONAR_RESULT" = success
