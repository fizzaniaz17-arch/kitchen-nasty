name: Sonar updateReservation scratch

on:
  push:
    branches:
      - scratch/sonar-update-reservation

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Analyze isolated function
        uses: SonarSource/sonarqube-scan-action@v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN2 }}
        with:
          projectBaseDir: sonar-scratch
          args: >
            -Dsonar.projectKey=fizzaniaz17-arch_kitchen-nasty-update-reservation-scratch
            -Dsonar.organization=fizzaniaz17-arch
            -Dsonar.projectName=KitchenAsty-updateReservation-complexity-scratch
            -Dsonar.projectVersion=03d977cf352699dbfca919c4209056c1116e3818
            -Dsonar.sources=.
            -Dsonar.sourceEncoding=UTF-8

      - name: Verify isolated-file complexity
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN2 }}
          PROJECT_KEY: fizzaniaz17-arch_kitchen-nasty-update-reservation-scratch
          SOURCE_SHA: 03d977cf352699dbfca919c4209056c1116e3818
        run: |
          set -euo pipefail
          task_file=sonar-scratch/.scannerwork/report-task.txt
          ce_task_id="$(sed -n 's/^ceTaskId=//p' "$task_file" | tr -d '\r')"
          if [ -z "$ce_task_id" ]; then
            echo "Sonar scanner did not return a compute-engine task ID." >&2
            exit 1
          fi
          ce_task_url="https://sonarcloud.io/api/ce/task?id=${ce_task_id}"

          for attempt in $(seq 1 60); do
            task_json="$(curl -fsS -H "Authorization: Bearer ${SONAR_TOKEN}" "$ce_task_url")"
            task_status="$(printf '%s' "$task_json" | jq -r '.task.status')"
            if [ "$task_status" = "SUCCESS" ]; then
              analysis_id="$(printf '%s' "$task_json" | jq -r '.task.analysisId')"
              break
            fi
            if [ "$task_status" = "FAILED" ] || [ "$task_status" = "CANCELED" ]; then
              echo "Sonar compute-engine task ended with status $task_status." >&2
              exit 1
            fi
            sleep 5
          done

          if [ -z "${analysis_id:-}" ]; then
            echo "Timed out waiting for the Sonar analysis to finish." >&2
            exit 1
          fi

          measures_response="$(curl -sS -H "Authorization: Bearer ${SONAR_TOKEN}" --get \
            "https://sonarcloud.io/api/measures/component" \
            --data-urlencode "branch=scratch/sonar-update-reservation" \
            --data-urlencode "component=${PROJECT_KEY}:updateReservation.ts" \
            --data-urlencode "metricKeys=complexity" \
            --write-out $'\n%{http_code}')"
          http_status="${measures_response##*$'\n'}"
          measures_json="${measures_response%$'\n'*}"
          if [ "$http_status" = "403" ]; then
            {
              echo "### Function-level Sonar analysis"
              echo "- Analysis ID: \`$analysis_id\`"
              echo "- Source commit: \`$SOURCE_SHA\`"
              echo "- Indexed TypeScript files: one (\`sonar-scratch/updateReservation.ts\`), containing only \`updateReservation\`"
              echo "- Metric retrieval: blocked; the analysis token received HTTP 403 from the measures API."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "analysisId=$analysis_id complexity=unavailable sourceSha=$SOURCE_SHA measuresApiStatus=403"
            exit 0
          fi
          if [ "$http_status" != "200" ]; then
            echo "Sonar measures API returned HTTP $http_status." >&2
            exit 1
          fi

          complexity="$(printf '%s' "$measures_json" | jq -r '.component.measures[] | select(.metric == "complexity") | .value')"
          if [ -z "$complexity" ] || [ "$complexity" = "null" ]; then
            echo "Sonar did not return complexity for the isolated source file." >&2
            exit 1
          fi

          {
            echo "### Function-level Sonar complexity"
            echo "- Sonar analysis ID: \`$analysis_id\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo "- Indexed TypeScript files: one (\`sonar-scratch/updateReservation.ts\`), containing only \`updateReservation\`"
            echo "- Sonar file complexity (isolated function): **$complexity**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "analysisId=$analysis_id complexity=$complexity sourceSha=$SOURCE_SHA"
