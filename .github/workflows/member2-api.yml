name: Member 2 API requirements

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reservation-api:
    name: Member 2 / Reservation API (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Start isolated PostgreSQL
        env:
          MEMBER2_DB_PASSWORD: ${{ secrets.MEMBER2_CI_POSTGRES_PASSWORD }}
        run: docker compose -p member2-ci -f tests/team/member-2/compose.test.yml up -d --wait postgres
      - name: Generate Prisma client from installed packages
        env:
          PRISMA_GENERATE_SKIP_AUTOINSTALL: '1'
        run: node node_modules/prisma/build/index.js generate --schema prisma/schema.prisma
      - run: node node_modules/prisma/build/index.js migrate deploy --schema prisma/schema.prisma
        env:
          DATABASE_URL: ${{ format('postgresql://member2:{0}@127.0.0.1:55432/kitchenasty_member2_test', secrets.MEMBER2_CI_POSTGRES_PASSWORD) }}
      - name: Verify generated cases and demonstrate both constraint changes
        run: |
          mkdir -p member2-results
          node tests/team/member-2/generate-ep-bva.mjs
          git diff --exit-code -- tests/team/member-2/generated/ep-bva-cases.json
          node --test tests/team/member-2/generator.test.mjs
          node tests/team/member-2/demo-constraints.mjs member2-results/constraints.json
      - name: Exercise reservation workflows
        working-directory: packages/server
        shell: bash
        env:
          DATABASE_URL: ${{ format('postgresql://member2:{0}@127.0.0.1:55432/kitchenasty_member2_test', secrets.MEMBER2_CI_POSTGRES_PASSWORD) }}
        run: |
          set -o pipefail
          MEMBER2_JWT_SECRET="$(openssl rand -hex 32)"
          echo "::add-mask::$MEMBER2_JWT_SECRET"
          export MEMBER2_JWT_SECRET
          node ../../node_modules/vitest/vitest.mjs run --config vitest.member2.config.ts --reporter=verbose --reporter=json --outputFile.json=../../member2-results/vitest.json 2>&1 | tee ../../member2-results/vitest.txt
      - name: Check generated case execution
        if: ${{ !cancelled() && hashFiles('member2-results/vitest.json') != '' }}
        run: node tests/team/member-2/audit-generated-coverage.mjs member2-results/vitest.json member2-results/generated-coverage.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: member2-api-evidence
          path: member2-results/
          if-no-files-found: warn
          retention-days: 14
